<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PokéWordle</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Custom Animations for Tile Flips */
        .cell-flip-correct { animation: flip-correct 0.6s ease forwards; }
        .cell-flip-present { animation: flip-present 0.6s ease forwards; }
        .cell-flip-absent  { animation: flip-absent 0.6s ease forwards; }

        @keyframes flip-correct {
            0%, 49% { transform: rotateX(0); background-color: transparent; border-color: #475569; }
            50% { transform: rotateX(-90deg); background-color: transparent; border-color: #475569; }
            51% { transform: rotateX(-90deg); background-color: #10b981; border-color: #10b981; color: white; }
            100% { transform: rotateX(0); background-color: #10b981; border-color: #10b981; color: white; }
        }
        @keyframes flip-present {
            0%, 49% { transform: rotateX(0); background-color: transparent; border-color: #475569; }
            50% { transform: rotateX(-90deg); background-color: transparent; border-color: #475569; }
            51% { transform: rotateX(-90deg); background-color: #f59e0b; border-color: #f59e0b; color: white; }
            100% { transform: rotateX(0); background-color: #f59e0b; border-color: #f59e0b; color: white; }
        }
        @keyframes flip-absent {
            0%, 49% { transform: rotateX(0); background-color: transparent; border-color: #475569; }
            50% { transform: rotateX(-90deg); background-color: transparent; border-color: #475569; }
            51% { transform: rotateX(-90deg); background-color: #334155; border-color: #334155; color: white; }
            100% { transform: rotateX(0); background-color: #334155; border-color: #334155; color: white; }
        }

        /* Pop animation for when typing */
        .cell-pop { animation: pop 0.1s ease-in-out forwards; }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Slide & Fade for Toasts and Hints */
        .fade-in-up { animation: fade-in-up 0.4s ease-out forwards; }
        .toast-enter { animation: fade-in-up-toast 0.3s ease-out forwards; }
        
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in-up-toast {
            0% { opacity: 0; transform: translate(-50%, 10px); }
            100% { opacity: 1; transform: translate(-50%, 0); }
        }

        /* Prevent zooming on inputs on iOS */
        * { touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans overflow-x-hidden selection:bg-red-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- DATABASE ---
        // Each entry now contains exactly 2 hints.
        const POKEMON_DB = [
            // Pokémon
            { name: "BULBASAUR", category: "Pokémon", hints: ["Introduced in Generation 1", "Type: Grass / Poison"] },

            { name: "MEOWSCARADA", category: "Pokémon", hints: ["Introduced in Generation 9", "Signature move: Flower Trick"] },
            { name: "TINKATON", category: "Pokémon", hints: ["Introduced in Generation 9", "Swings a massive hammer made of Corviknight armor"] },
            { name: "KORAIDON", category: "Pokémon", hints: ["Generation 9 Box Legendary", "Type: Fighting / Dragon"] },
            { name: "MIRAIDON", category: "Pokémon", hints: ["Generation 9 Box Legendary", "Type: Electric / Dragon"] },
            { name: "PORYGON-Z", category: "Pokémon", hints: ["Introduced in Generation 4", "Evolves when traded holding a Dubious Disc"] },
            { name: "CHIEN-PAO", category: "Pokémon", hints: ["Generation 9 Legendary", "One of the four Treasures of Ruin"] },
            { name: "OGERPON", category: "Pokémon", hints: ["Generation 9 (DLC) Legendary", "Wears different masks to change its typing"] },
            { name: "TERAPAGOS", category: "Pokémon", hints: ["Generation 9 (DLC) Legendary", "Directly linked to the Terastal phenomenon"] },
            { name: "XERNEAS", category: "Pokémon", hints: ["Generation 6 Box Legendary", "Has the signature 'Fairy Aura' ability"] },
            { name: "YVELTAL", category: "Pokémon", hints: ["Generation 6 Box Legendary", "Known as the Destruction Pokémon"] },

            // Moves
            { name: "WILL-O-WISP", category: "Move", hints: ["Inflicts the Burn status condition", "Originally the signature move of Duskull's line"] },
            { name: "THUNDERBOLT", category: "Move", hints: ["Has a 10% chance to Paralyze", "Base Power: 90"] },
            { name: "EARTHQUAKE", category: "Move", hints: ["Hits all adjacent Pokémon on the field", "Base Power: 100"] },
            { name: "FLAMETHROWER", category: "Move", hints: ["Has a 10% chance to Burn", "Base Power: 90"] },

            { name: "U-TURN", category: "Move", hints: ["User switches out immediately after dealing damage", "Type: Bug"] },
            { name: "V-CREATE", category: "Move", hints: ["Lowers user's Defense, Sp. Def, and Speed after use", "Signature move of Victini"] },

            { name: "SHADOW-BALL", category: "Move", hints: ["20% chance to lower target's Sp. Def", "Type: Ghost"] },
            { name: "HYPER-BEAM", category: "Move", hints: ["User must recharge on the following turn", "Type: Normal"] },

            { name: "DRAGON-CLAW", category: "Move", hints: ["Type: Dragon", "Base Power: 80, has no secondary effects"] },

            // Items
            { name: "MASTER-BALL", category: "Item", hints: ["Catches any wild Pokémon without fail", "Developed by Silph Co."] },
            { name: "ULTRA-BALL", category: "Item", hints: ["Has a 2x catch rate modifier", "Distinctive black and yellow design"] },
            { name: "LEFTOVERS", category: "Item", hints: ["Restores 1/16 of max HP at the end of each turn", "Often found on wild Snorlax"] },
            { name: "EXP-SHARE", category: "Item", hints: ["Distributes experience to the whole party in modern games", "Originally called 'Exp. All' in Generation 1"] },
            { name: "FULL-RESTORE", category: "Item", hints: ["Heals all HP and cures all status conditions", "Often spammed by the Elite Four"] },
            { name: "POTION", category: "Item", hints: ["Restores exactly 20 HP", "The most basic healing item"] },
            { name: "MAX-REPEL", category: "Item", hints: ["Prevents wild encounters for 250 steps", "More step-efficient than a Super Repel"] },
            { name: "LUCKY-EGG", category: "Item", hints: ["Boosts EXP gained in battle by 50%", "Often held by wild Chansey"] },
            { name: "RARE-CANDY", category: "Item", hints: ["Instantly raises a Pokémon's level by 1", "Found scattered across every region"] },
            { name: "CHOICE-SCARF", category: "Item", hints: ["Boosts Speed by 50%", "Locks the user into the first move selected"] },
            { name: "MEGA-RING", category: "Item", hints: ["Key item introduced in Generation 6", "Allows compatible Pokémon to Mega Evolve"] },
            { name: "TERA-ORB", category: "Item", hints: ["Key item introduced in Generation 9", "Allows a Pokémon to Terastallize"] },

            // Abilities
            { name: "INTIMIDATE", category: "Ability", hints: ["Lowers opponents' Attack stat upon entering battle", "Common on Gyarados, Arcanine, and Salamence"] },
            { name: "LEVITATE", category: "Ability", hints: ["Grants immunity to Ground-type moves", "Gengar used to have this, but lost it in Gen 7"] },
            { name: "STURDY", category: "Ability", hints: ["Prevents OHKO moves from working", "Functions like a Focus Sash when at full HP"] },
            { name: "STATIC", category: "Ability", hints: ["30% chance to paralyze the attacker on contact", "Pikachu's primary ability"] },
            { name: "SYNCHRONIZE", category: "Ability", hints: ["Passes Burn, Poison, or Paralysis to the attacker", "Useful in the overworld for finding wild Pokémon of the same Nature"] },
            { name: "SPEED-BOOST", category: "Ability", hints: ["Raises Speed by 1 stage at the end of each turn", "Hidden ability of Torchic's evolutionary line"] },
            { name: "MULTI-SCALE", category: "Ability", hints: ["Halves damage taken when at full HP", "Dragonite's Hidden Ability"] },
            { name: "TOUGH-CLAWS", category: "Ability", hints: ["Boosts the power of contact moves by 30%", "Mega Charizard X has this ability"] },
            { name: "HUGE-POWER", category: "Ability", hints: ["Doubles the Pokémon's physical Attack stat", "Azumarill and Diggersby are famous for using this"] },
            { name: "BEAST-BOOST", category: "Ability", hints: ["Raises highest stat after knocking out a Pokémon", "Signature ability of the Ultra Beasts"] },
            { name: "PROTEAN", category: "Ability", hints: ["Changes the user's type to match the move used", "Greninja's Hidden Ability"] },
            { name: "LIBERO", category: "Ability", hints: ["Changes the user's type to match the move used", "Cinderace's Hidden Ability"] }
        ];

        // --- UTILS ---
        const CAT_ICONS = { "Pokémon": "🐾", "Move": "⚔️", "Item": "🎒", "Ability": "✨" };
        const MAX_GUESSES = 6;

        const getDailyTargetIndex = () => {
            const epoch = new Date("2024-01-01T00:00:00").getTime();
            const today = new Date().setHours(0,0,0,0);
            return Math.floor((today - epoch) / 86400000);
        };

        const evaluateGuess = (guessLetters, targetLetters) => {
            const guess = guessLetters.split('');
            const target = targetLetters.split('');
            const statuses = Array(guess.length).fill('absent');

            // Find Correct (Green)
            for (let i = 0; i < guess.length; i++) {
                if (guess[i] === target[i]) {
                    statuses[i] = 'correct';
                    target[i] = null;
                }
            }
            // Find Present (Yellow)
            for (let i = 0; i < guess.length; i++) {
                if (statuses[i] !== 'correct' && target.includes(guess[i])) {
                    statuses[i] = 'present';
                    target[target.indexOf(guess[i])] = null;
                }
            }
            return statuses;
        };

        // --- COMPONENTS ---

        // SVG Pokeball Icon
        const Pokeball = ({ className }) => (
            <svg viewBox="0 0 100 100" className={className} fill="currentColor">
                <circle cx="50" cy="50" r="45" stroke="currentColor" strokeWidth="6" fill="transparent" />
                <path d="M 5 50 A 45 45 0 0 1 95 50 Z" fill="currentColor" />
                <circle cx="50" cy="50" r="14" stroke="currentColor" strokeWidth="6" fill="#0f172a" />
                <circle cx="50" cy="50" r="6" fill="currentColor" />
            </svg>
        );

        // Toast Notification
        const Toast = ({ message }) => {
            if (!message) return null;
            return (
                <div className="fixed top-20 left-1/2 z-50 px-4 py-2 bg-slate-100 text-slate-900 font-bold rounded shadow-lg toast-enter pointer-events-none whitespace-nowrap text-center">
                    {message}
                </div>
            );
        };

        // Modal Base Component
        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-40 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm transition-opacity">
                    <div className="bg-slate-800 border border-slate-700 rounded-xl shadow-2xl w-full max-w-md p-6 relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold">&times;</button>
                        <h2 className="text-2xl font-bold mb-4 flex items-center gap-2">{title}</h2>
                        {children}
                    </div>
                </div>
            );
        };

        // Single Cell
        const Cell = ({ value, status, isHyphen, animDelay, isAnimating }) => {
            if (isHyphen) {
                return (
                    <div className="flex items-center justify-center w-full aspect-square text-slate-500 text-2xl font-bold bg-slate-800/50 rounded">
                        -
                    </div>
                );
            }

            let baseClasses = "flex items-center justify-center w-full aspect-square text-xl sm:text-2xl font-bold rounded border-2 transition-colors duration-300 ";
            
            if (!status) {
                baseClasses += value ? "border-slate-400 cell-pop" : "border-slate-700";
            } else {
                if (isAnimating) {
                    baseClasses += `cell-flip-${status} border-transparent`;
                } else {
                    if (status === 'correct') baseClasses += "bg-emerald-500 border-emerald-500 text-white";
                    if (status === 'present') baseClasses += "bg-amber-500 border-amber-500 text-white";
                    if (status === 'absent') baseClasses += "bg-slate-700 border-slate-700 text-white";
                }
            }

            return (
                <div className={baseClasses} style={{ animationDelay: isAnimating ? `${animDelay}ms` : '0ms' }}>
                    {value}
                </div>
            );
        };

        // Game Grid Row
        const Row = ({ targetName, guessLetters, isEvaluated, isAnimating, statuses }) => {
            const chars = targetName.split('');
            let letterIdx = 0;

            return (
                <div className="grid gap-1 sm:gap-2 w-full" style={{ gridTemplateColumns: `repeat(${chars.length}, minmax(0, 1fr))` }}>
                    {chars.map((char, i) => {
                        if (char === '-') {
                            return <Cell key={i} isHyphen={true} />;
                        }
                        const val = guessLetters[letterIdx] || '';
                        const status = isEvaluated ? statuses[letterIdx] : null;
                        const delay = letterIdx * 150;
                        letterIdx++;
                        return <Cell key={i} value={val} status={status} isAnimating={isAnimating} animDelay={delay} />;
                    })}
                </div>
            );
        };

        // Virtual Keyboard
        const Keyboard = ({ onChar, onDelete, onEnter, statuses }) => {
            const rows = [
                ['Q','W','E','R','T','Y','U','I','O','P'],
                ['A','S','D','F','G','H','J','K','L'],
                ['ENTER','Z','X','C','V','B','N','M','BACK']
            ];

            return (
                <div className="w-full max-w-lg mx-auto flex flex-col gap-2 p-2 mt-4 sm:mt-8">
                    {rows.map((row, i) => (
                        <div key={i} className="flex justify-center gap-1 sm:gap-2 w-full">
                            {row.map(key => {
                                const isEnter = key === 'ENTER';
                                const isBack = key === 'BACK';
                                const status = statuses[key];
                                
                                let bgClass = "bg-slate-500 hover:bg-slate-400";
                                if (status === 'correct') bgClass = "bg-emerald-500 text-white";
                                else if (status === 'present') bgClass = "bg-amber-500 text-white";
                                else if (status === 'absent') bgClass = "bg-slate-800 text-slate-500";

                                return (
                                    <button
                                        key={key}
                                        onClick={() => isEnter ? onEnter() : isBack ? onDelete() : onChar(key)}
                                        className={`${bgClass} font-bold rounded ${isEnter || isBack ? 'px-2 sm:px-4 text-xs sm:text-sm flex-[1.5]' : 'flex-1 text-sm sm:text-lg'} h-12 sm:h-14 flex items-center justify-center transition-colors shadow`}
                                    >
                                        {isBack ? '⌫' : key}
                                    </button>
                                );
                            })}
                        </div>
                    ))}
                </div>
            );
        };

        // Main Game Container
        const Game = ({ mode, target, onModeSwitch }) => {
            const [guesses, setGuesses] = useState([]);
            const [currentGuess, setCurrentGuess] = useState('');
            const [gameStatus, setGameStatus] = useState('playing'); // playing, won, lost
            const [animatingRow, setAnimatingRow] = useState(-1);
            const [revealedRows, setRevealedRows] = useState(0);
            const [toast, setToast] = useState('');
            const [showStats, setShowStats] = useState(false);

            const targetLettersOnly = useMemo(() => target.name.replace(/-/g, ''), [target.name]);
            const targetLength = targetLettersOnly.length;

            // Load saved state (Only for Daily Mode)
            useEffect(() => {
                if (mode === 'daily') {
                    const saved = JSON.parse(localStorage.getItem('pokeWordleDaily')) || {};
                    if (saved.dayIndex === getDailyTargetIndex() && saved.guesses) {
                        setGuesses(saved.guesses);
                        setRevealedRows(saved.guesses.length);
                        setGameStatus(saved.gameStatus || 'playing');
                        if (saved.gameStatus !== 'playing') setTimeout(() => setShowStats(true), 500);
                    }
                }
            }, [mode]);

            // Save state
            useEffect(() => {
                if (mode === 'daily' && guesses.length > 0 && animatingRow === -1) {
                    localStorage.setItem('pokeWordleDaily', JSON.stringify({
                        dayIndex: getDailyTargetIndex(),
                        guesses,
                        gameStatus
                    }));
                }
            }, [guesses, gameStatus, mode, animatingRow]);

            const showMessage = (msg, time = 2000) => {
                setToast(msg);
                setTimeout(() => setToast(''), time);
            };

            const handleChar = useCallback((char) => {
                if (gameStatus !== 'playing' || animatingRow !== -1) return;
                if (currentGuess.length < targetLength) setCurrentGuess(prev => prev + char);
            }, [currentGuess, gameStatus, animatingRow, targetLength]);

            const handleDelete = useCallback(() => {
                if (gameStatus !== 'playing' || animatingRow !== -1) return;
                setCurrentGuess(prev => prev.slice(0, -1));
            }, [gameStatus, animatingRow]);

            const handleEnter = useCallback(() => {
                if (gameStatus !== 'playing' || animatingRow !== -1) return;
                if (currentGuess.length !== targetLength) {
                    showMessage("Not enough letters");
                    return;
                }

                const newGuesses = [...guesses, currentGuess];
                setGuesses(newGuesses);
                setCurrentGuess('');
                setAnimatingRow(newGuesses.length - 1);

                // Wait for animation to finish before updating game status & keyboard
                const animDuration = (targetLength * 150) + 600;
                setTimeout(() => {
                    setRevealedRows(newGuesses.length);
                    setAnimatingRow(-1);

                    const isWin = currentGuess === targetLettersOnly;
                    if (isWin) {
                        setGameStatus('won');
                        showMessage("Super Effective!", 3000);
                        updateStats(true, newGuesses.length);
                        setTimeout(() => setShowStats(true), 2000);
                    } else if (newGuesses.length === MAX_GUESSES) {
                        setGameStatus('lost');
                        showMessage(`It was ${target.name}`, null); // Persistent
                        updateStats(false);
                        setTimeout(() => setShowStats(true), 2000);
                    }
                }, animDuration);
            }, [currentGuess, targetLength, guesses, gameStatus, animatingRow, targetLettersOnly, target.name]);

            // Global Keyboard Listener
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Enter') handleEnter();
                    else if (e.key === 'Backspace') handleDelete();
                    else if (/^[A-Za-z]$/.test(e.key)) handleChar(e.key.toUpperCase());
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleEnter, handleDelete, handleChar]);

            // Calculate keyboard statuses
            const keyboardStatuses = useMemo(() => {
                const statuses = {};
                guesses.slice(0, revealedRows).forEach(g => {
                    const rowStatus = evaluateGuess(g, targetLettersOnly);
                    g.split('').forEach((char, i) => {
                        const current = statuses[char];
                        const s = rowStatus[i];
                        if (s === 'correct') statuses[char] = 'correct';
                        else if (s === 'present' && current !== 'correct') statuses[char] = 'present';
                        else if (s === 'absent' && current !== 'correct' && current !== 'present') statuses[char] = 'absent';
                    });
                });
                return statuses;
            }, [guesses, revealedRows, targetLettersOnly]);

            // Calculate active hints based on how many guesses have been made
            const activeHints = useMemo(() => {
                const hints = [];
                // If 3 guesses have been fully revealed (meaning they are on guess 4), show Hint 1
                if (revealedRows >= 3 && target.hints[0]) hints.push(target.hints[0]);
                // If 4 guesses have been fully revealed (meaning they are on guess 5), show Hint 2
                if (revealedRows >= 4 && target.hints[1]) hints.push(target.hints[1]);
                return hints;
            }, [revealedRows, target.hints]);

            // Stats Logic
            const updateStats = (won, numGuesses) => {
                if (mode !== 'daily') return;
                const stats = JSON.parse(localStorage.getItem('pokeWordleStats')) || { played: 0, wins: 0, currentStreak: 0, maxStreak: 0, dist: Array(6).fill(0) };
                stats.played++;
                if (won) {
                    stats.wins++;
                    stats.currentStreak++;
                    stats.maxStreak = Math.max(stats.maxStreak, stats.currentStreak);
                    stats.dist[numGuesses - 1]++;
                } else {
                    stats.currentStreak = 0;
                }
                localStorage.setItem('pokeWordleStats', JSON.stringify(stats));
            };

            const shareResult = () => {
                const title = mode === 'daily' ? `PokéWordle Daily ${getDailyTargetIndex()}` : 'PokéWordle Unlimited';
                const attempt = gameStatus === 'won' ? guesses.length : 'X';
                let grid = guesses.map(g => {
                    const s = evaluateGuess(g, targetLettersOnly);
                    let sIdx = 0;
                    return target.name.split('').map(char => {
                        if (char === '-') return '➖';
                        const status = s[sIdx++];
                        if (status === 'correct') return '🟩';
                        if (status === 'present') return '🟨';
                        return '⬛';
                    }).join('');
                }).join('\n');

                const text = `${title} ${attempt}/${MAX_GUESSES}\n\n${grid}`;
                navigator.clipboard.writeText(text).then(() => showMessage("Copied to clipboard!"));
            };

            const statsData = JSON.parse(localStorage.getItem('pokeWordleStats')) || { played: 0, wins: 0, currentStreak: 0, maxStreak: 0, dist: Array(6).fill(0) };

            return (
                <div className="flex flex-col min-h-screen pt-4 pb-8">
                    <Toast message={toast} />

                    {/* Header */}
                    <header className="flex flex-col items-center justify-center mb-6 px-4">
                        <div className="flex items-center gap-3 bg-red-600 px-6 py-3 rounded-full shadow-lg border-4 border-slate-900 ring-4 ring-red-600/30">
                            <Pokeball className="w-8 h-8 text-white" />
                            <h1 className="text-3xl font-black tracking-wider text-white">PokéWordle</h1>
                        </div>
                        <div className="flex items-center gap-4 mt-4 text-sm font-semibold">
                            <button onClick={() => onModeSwitch('daily')} className={`px-4 py-1 rounded-full transition ${mode === 'daily' ? 'bg-slate-100 text-slate-900' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>Daily</button>
                            <button onClick={() => onModeSwitch('unlimited')} className={`px-4 py-1 rounded-full transition ${mode === 'unlimited' ? 'bg-slate-100 text-slate-900' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>Unlimited</button>
                            <button onClick={() => setShowStats(true)} className="px-2 py-1 text-slate-400 hover:text-white">📊</button>
                        </div>
                        
                        <div className="mt-6 inline-flex items-center gap-2 px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg shadow">
                            <span className="text-slate-400">Target Category:</span>
                            <span className="font-bold text-amber-400">{CAT_ICONS[target.category]} {target.category}</span>
                        </div>
                    </header>

                    {/* Game Grid */}
                    <main className="flex-1 flex flex-col items-center justify-start w-full px-4 pt-2">
                        <div className="w-full max-w-md flex flex-col gap-1 sm:gap-2">
                            {Array.from({ length: MAX_GUESSES }).map((_, i) => {
                                const isCurrent = i === guesses.length;
                                const isEvaluated = i < revealedRows;
                                const isAnimating = i === animatingRow;
                                const guessLetters = isCurrent ? currentGuess : (guesses[i] || '');
                                const statuses = (isEvaluated || isAnimating) ? evaluateGuess(guesses[i], targetLettersOnly) : null;

                                return (
                                    <Row 
                                        key={i} 
                                        targetName={target.name} 
                                        guessLetters={guessLetters}
                                        isEvaluated={isEvaluated || isAnimating}
                                        isAnimating={isAnimating}
                                        statuses={statuses}
                                    />
                                );
                            })}
                        </div>

                        {/* Hint Section */}
                        <div className="w-full max-w-md mt-4 flex flex-col gap-2 min-h-[4rem]">
                            {activeHints.map((hint, i) => (
                                <div key={i} className="flex items-start gap-3 px-4 py-3 bg-slate-800 border-l-4 border-amber-400 rounded-r-lg shadow-md fade-in-up">
                                    <span className="text-xl leading-none">💡</span>
                                    <span className="text-sm font-medium text-slate-200">
                                        <span className="text-amber-400 font-bold mr-1">Hint {i + 1}:</span>
                                        {hint}
                                    </span>
                                </div>
                            ))}
                        </div>
                    </main>

                    <Keyboard onChar={handleChar} onDelete={handleDelete} onEnter={handleEnter} statuses={keyboardStatuses} />

                    {/* Stats & Game Over Modal */}
                    <Modal isOpen={showStats} onClose={() => setShowStats(false)} title={gameStatus === 'playing' ? "Statistics" : (gameStatus === 'won' ? "You Won!" : "Game Over")}>
                        {gameStatus !== 'playing' && (
                            <div className="mb-6 text-center">
                                <p className="text-slate-400 mb-1">The target was</p>
                                <p className="text-2xl font-black text-amber-400 tracking-widest">{target.name}</p>
                            </div>
                        )}
                        
                        <div className="grid grid-cols-4 gap-2 mb-6 text-center">
                            <div className="bg-slate-700 p-2 rounded"><div className="text-2xl font-bold">{statsData.played}</div><div className="text-xs text-slate-400">Played</div></div>
                            <div className="bg-slate-700 p-2 rounded"><div className="text-2xl font-bold">{statsData.played > 0 ? Math.round((statsData.wins/statsData.played)*100) : 0}%</div><div className="text-xs text-slate-400">Win %</div></div>
                            <div className="bg-slate-700 p-2 rounded"><div className="text-2xl font-bold">{statsData.currentStreak}</div><div className="text-xs text-slate-400">Streak</div></div>
                            <div className="bg-slate-700 p-2 rounded"><div className="text-2xl font-bold">{statsData.maxStreak}</div><div className="text-xs text-slate-400">Max</div></div>
                        </div>

                        {gameStatus !== 'playing' && (
                            <div className="flex flex-col gap-3">
                                <button onClick={shareResult} className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-white font-bold rounded-lg transition">
                                    Share Result
                                </button>
                                {mode === 'unlimited' && (
                                    <button onClick={() => onModeSwitch('unlimited_force')} className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-white font-bold rounded-lg transition">
                                        Play Again
                                    </button>
                                )}
                            </div>
                        )}
                    </Modal>
                </div>
            );
        };

        // App Wrapper - Manages Mode State
        const App = () => {
            const [mode, setMode] = useState('daily'); // 'daily' | 'unlimited'
            const [key, setKey] = useState(0); // Force remount Game component on unlimited retry
            
            const target = useMemo(() => {
                if (mode === 'daily') {
                    return POKEMON_DB[getDailyTargetIndex() % POKEMON_DB.length];
                } else {
                    return POKEMON_DB[Math.floor(Math.random() * POKEMON_DB.length)];
                }
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [mode, key]);

            const handleModeSwitch = (newMode) => {
                if (newMode === 'unlimited_force') {
                    setMode('unlimited');
                    setKey(k => k + 1);
                } else if (newMode !== mode) {
                    setMode(newMode);
                    setKey(k => k + 1);
                }
            };

            return <Game key={`${mode}-${key}`} mode={mode} target={target} onModeSwitch={handleModeSwitch} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
