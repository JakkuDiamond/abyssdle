<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abyssdle</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Custom Animations for Tile Flips */
        .cell-flip-correct { animation: flip-correct 0.6s ease forwards; }
        .cell-flip-present { animation: flip-present 0.6s ease forwards; }
        .cell-flip-absent  { animation: flip-absent 0.6s ease forwards; }

        @keyframes flip-correct {
            0%, 49% { transform: rotateX(0); background-color: transparent; border-color: #475569; }
            50% { transform: rotateX(-90deg); background-color: transparent; border-color: #475569; }
            51% { transform: rotateX(-90deg); background-color: #10b981; border-color: #10b981; color: white; }
            100% { transform: rotateX(0); background-color: #10b981; border-color: #10b981; color: white; }
        }
        @keyframes flip-present {
            0%, 49% { transform: rotateX(0); background-color: transparent; border-color: #475569; }
            50% { transform: rotateX(-90deg); background-color: transparent; border-color: #475569; }
            51% { transform: rotateX(-90deg); background-color: #f59e0b; border-color: #f59e0b; color: white; }
            100% { transform: rotateX(0); background-color: #f59e0b; border-color: #f59e0b; color: white; }
        }
        @keyframes flip-absent {
            0%, 49% { transform: rotateX(0); background-color: transparent; border-color: #475569; }
            50% { transform: rotateX(-90deg); background-color: transparent; border-color: #475569; }
            51% { transform: rotateX(-90deg); background-color: #334155; border-color: #334155; color: white; }
            100% { transform: rotateX(0); background-color: #334155; border-color: #334155; color: white; }
        }

        /* Pop animation for when typing */
        .cell-pop { animation: pop 0.1s ease-in-out forwards; }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Shake animation for invalid words */
        .row-shake { animation: shake 0.5s; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Slide & Fade for Toasts */
        .toast-enter { animation: fade-in-up-toast 0.3s ease-out forwards; }
        @keyframes fade-in-up-toast {
            0% { opacity: 0; transform: translate(-50%, 10px); }
            100% { opacity: 1; transform: translate(-50%, 0); }
        }
        
        .spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Prevent zooming on inputs on iOS */
        * { touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans overflow-x-hidden selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- POKEAPI INTEGRATION ---
        const CACHE_KEY = 'abyssdle_pokeapi_cache_v4'; // Updated key to force fresh download
        const FALLBACK_DB = [{ name: "PIKACHU", category: "Pokémon", url: "https://pokeapi.co/api/v2/pokemon/pikachu" }];
        
        const loadPokeAPI = async () => {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                const parsed = JSON.parse(cached);
                // Cache valid for 7 days
                if (Date.now() - parsed.timestamp < 7 * 24 * 60 * 60 * 1000) {
                    return parsed.data;
                }
            }

            const endpoints = [
                { cat: 'Pokémon', url: 'https://pokeapi.co/api/v2/pokemon-species?limit=1500' },
                { cat: 'Move', url: 'https://pokeapi.co/api/v2/move?limit=1000' },
                { cat: 'Item', url: 'https://pokeapi.co/api/v2/item?limit=2000' },
                { cat: 'Ability', url: 'https://pokeapi.co/api/v2/ability?limit=500' }
            ];

            try {
                let combined = [];
                for (const ep of endpoints) {
                    const res = await fetch(ep.url);
                    const data = await res.json();
                    
                    // Filter: Only letters and hyphens, length between 3 and 12 chars
                    const filtered = data.results.filter(r => /^[a-z\-]+$/.test(r.name) && r.name.length >= 3 && r.name.length <= 12);
                    
                    combined.push(...filtered.map(item => ({
                        name: item.name.toUpperCase(),
                        category: ep.cat,
                        url: item.url
                    })));
                }
                
                // Sort deterministically to ensure the daily index targets the same item for everyone
                combined.sort((a, b) => a.name.localeCompare(b.name));
                
                // Extra safety: Only cache if we actually got a lot of data
                if (combined.length > 1000) {
                    localStorage.setItem(CACHE_KEY, JSON.stringify({
                        timestamp: Date.now(),
                        data: combined
                    }));
                }
                
                return combined;
            } catch (err) {
                console.error("Failed to load from PokeAPI", err);
                return FALLBACK_DB; // Fallback to avoid crashing
            }
        };

        const fetchHints = async (targetMeta) => {
            try {
                const res = await fetch(targetMeta.url);
                const data = await res.json();
                let hints = [];

                const getEnglishFlavor = (entries) => {
                    if (!entries) return null;
                    const entry = entries.find(f => f.language.name === 'en');
                    return entry ? entry.flavor_text.replace(/[\n\f\r]/g, ' ').replace(/\s+/g, ' ') : null;
                };

                // SAFE object unwrap utility to prevent "Cannot read property of undefined" crashes
                const getSafeProp = (obj, defaultText = "UNKNOWN") => {
                    return (obj?.name || defaultText).toUpperCase().replace(/-/g, ' ');
                };

                if (targetMeta.category === 'Pokémon') {
                    hints.push(`Introduced in: ${getSafeProp(data.generation, 'UNKNOWN GEN')}`);
                    const flavor = getEnglishFlavor(data.flavor_text_entries);
                    hints.push(flavor || `Color: ${getSafeProp(data.color, 'Unknown')}`);
                } 
                else if (targetMeta.category === 'Move') {
                    hints.push(`Type: ${getSafeProp(data.type)} | Class: ${getSafeProp(data.damage_class)}`);
                    const flavor = getEnglishFlavor(data.flavor_text_entries);
                    hints.push(flavor || `PP: ${data.pp || 'N/A'} | Power: ${data.power || 'N/A'}`);
                } 
                else if (targetMeta.category === 'Item') {
                    hints.push(`Category: ${getSafeProp(data.category)}`);
                    const effect = data.effect_entries?.find(e => e.language.name === 'en')?.short_effect;
                    const flavor = getEnglishFlavor(data.flavor_text_entries);
                    hints.push(effect || flavor || `Cost: ${data.cost || 'N/A'}`);
                } 
                else if (targetMeta.category === 'Ability') {
                    hints.push(`Introduced in: ${getSafeProp(data.generation, 'UNKNOWN GEN')}`);
                    const effect = data.effect_entries?.find(e => e.language.name === 'en')?.short_effect;
                    const flavor = getEnglishFlavor(data.flavor_text_entries);
                    hints.push(effect || flavor || "A special ability.");
                }

                return hints;
            } catch (e) {
                console.error(e);
                return ["Data corrupted in the Abyss.", "No further hints available."];
            }
        };

        // --- UTILS ---
        const CAT_ICONS = { "Pokémon": "🐾", "Move": "⚔️", "Item": "🎒", "Ability": "✨" };
        const MAX_GUESSES = 6;

        const getDailyTargetIndex = () => {
            const epoch = new Date("2026-10-14T00:00:00").getTime();
            const today = new Date().setHours(0,0,0,0);
            const diff = Math.floor((today - epoch) / 86400000);
            return diff >= 0 ? diff : 0; 
        };

        const evaluateGuess = (guessLetters, targetLetters) => {
            const guess = guessLetters.split('');
            const target = targetLetters.split('');
            const statuses = Array(guess.length).fill('absent');

            for (let i = 0; i < guess.length; i++) {
                if (guess[i] === target[i]) {
                    statuses[i] = 'correct';
                    target[i] = null;
                }
            }
            for (let i = 0; i < guess.length; i++) {
                if (statuses[i] !== 'correct' && target.includes(guess[i])) {
                    statuses[i] = 'present';
                    target[target.indexOf(guess[i])] = null;
                }
            }
            return statuses;
        };

        // --- COMPONENTS ---

        // Relic Crown SVG
        const RelicCrown = ({ className }) => (
            <svg viewBox="0 0 64 64" className={className} fill="currentColor">
                <path d="M8 52 L56 52 L52 60 L12 60 Z" opacity="0.7"/>
                <path d="M10 50 L4 18 L20 34 L32 8 L44 34 L60 18 L54 50 Z"/>
                <circle cx="32" cy="26" r="3" fill="#0f172a"/>
                <circle cx="16" cy="34" r="2" fill="#0f172a"/>
                <circle cx="48" cy="34" r="2" fill="#0f172a"/>
            </svg>
        );

        // Toast Notification
        const Toast = ({ message }) => {
            if (!message) return null;
            return (
                <div className="fixed top-20 left-1/2 z-50 px-4 py-2 bg-slate-100 text-slate-900 font-bold rounded shadow-lg toast-enter pointer-events-none whitespace-nowrap text-center">
                    {message}
                </div>
            );
        };

        // Modal Base Component
        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-40 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm transition-opacity">
                    <div className="bg-slate-800 border border-slate-700 rounded-xl shadow-2xl w-full max-w-md p-6 relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl font-bold leading-none">&times;</button>
                        <h2 className="text-2xl font-bold mb-4 flex items-center gap-2">{title}</h2>
                        {children}
                    </div>
                </div>
            );
        };

        // Single Cell
        const Cell = ({ value, status, animDelay, isAnimating }) => {
            let baseClasses = "flex items-center justify-center w-full aspect-square text-xl sm:text-2xl font-bold rounded border-2 transition-colors duration-300 ";
            
            if (!status) {
                baseClasses += value ? "border-slate-400 cell-pop" : "border-slate-700";
            } else {
                if (isAnimating) {
                    baseClasses += `cell-flip-${status} border-transparent`;
                } else {
                    if (status === 'correct') baseClasses += "bg-emerald-500 border-emerald-500 text-white";
                    if (status === 'present') baseClasses += "bg-amber-500 border-amber-500 text-white";
                    if (status === 'absent') baseClasses += "bg-slate-700 border-slate-700 text-white";
                }
            }

            return (
                <div className={baseClasses} style={{ animationDelay: isAnimating ? `${animDelay}ms` : '0ms' }}>
                    {value}
                </div>
            );
        };

        // Game Grid Row
        const Row = ({ targetLength, guessLetters, isEvaluated, isAnimating, isShaking, statuses }) => {
            let rowClasses = "grid gap-1 sm:gap-2 w-full max-w-2xl mx-auto";
            if (isShaking) rowClasses += " row-shake";

            return (
                <div className={rowClasses} style={{ gridTemplateColumns: `repeat(${targetLength}, minmax(0, 1fr))` }}>
                    {Array.from({ length: targetLength }).map((_, i) => {
                        const val = guessLetters[i] || '';
                        const status = isEvaluated ? statuses[i] : null;
                        const delay = i * 150;
                        return <Cell key={i} value={val} status={status} isAnimating={isAnimating} animDelay={delay} />;
                    })}
                </div>
            );
        };

        // Virtual Keyboard
        const Keyboard = ({ onChar, onDelete, onEnter, statuses }) => {
            const rows = [
                ['Q','W','E','R','T','Y','U','I','O','P'],
                ['A','S','D','F','G','H','J','K','L','-'],
                ['ENTER','Z','X','C','V','B','N','M','BACK']
            ];

            return (
                <div className="w-full max-w-2xl mx-auto flex flex-col gap-2 p-2 mt-4 sm:mt-8">
                    {rows.map((row, i) => (
                        <div key={i} className="flex justify-center gap-1 sm:gap-2 w-full">
                            {row.map(key => {
                                const isEnter = key === 'ENTER';
                                const isBack = key === 'BACK';
                                const status = statuses[key];
                                
                                let bgClass = "bg-slate-500 hover:bg-slate-400";
                                if (status === 'correct') bgClass = "bg-emerald-500 text-white";
                                else if (status === 'present') bgClass = "bg-amber-500 text-white";
                                else if (status === 'absent') bgClass = "bg-slate-800 text-slate-500";

                                return (
                                    <button
                                        key={key}
                                        onClick={() => isEnter ? onEnter() : isBack ? onDelete() : onChar(key)}
                                        className={`${bgClass} font-bold rounded ${isEnter || isBack ? 'px-2 sm:px-4 text-xs sm:text-sm flex-[1.5]' : 'flex-1 text-sm sm:text-lg'} h-12 sm:h-14 flex items-center justify-center transition-colors shadow`}
                                    >
                                        {isBack ? '⌫' : key}
                                    </button>
                                );
                            })}
                        </div>
                    ))}
                </div>
            );
        };

        // Main Game Container
        const Game = ({ mode, target, dictionary, onModeSwitch }) => {
            const [guesses, setGuesses] = useState([]);
            const [currentGuess, setCurrentGuess] = useState('');
            const [gameStatus, setGameStatus] = useState('playing'); 
            const [animatingRow, setAnimatingRow] = useState(-1);
            const [revealedRows, setRevealedRows] = useState(0);
            const [shakeRow, setShakeRow] = useState(-1);
            
            const [showStats, setShowStats] = useState(false);
            const [showHintModal, setShowHintModal] = useState(false);
            const [showInfoModal, setShowInfoModal] = useState(false);
            const [hintsRevealed, setHintsRevealed] = useState(0); 
            const [toast, setToast] = useState('');

            const targetLength = target.name.length;

            // Load saved state
            useEffect(() => {
                if (mode === 'daily') {
                    const saved = JSON.parse(localStorage.getItem('abyssdleDaily_v2')) || {};
                    if (saved.dayIndex === getDailyTargetIndex() && saved.guesses) {
                        setGuesses(saved.guesses);
                        setRevealedRows(saved.guesses.length);
                        setGameStatus(saved.gameStatus || 'playing');
                        setHintsRevealed(saved.hintsRevealed || 0);
                        if (saved.gameStatus !== 'playing') setTimeout(() => setShowStats(true), 500);
                    }
                }
            }, [mode]);

            // Save state
            useEffect(() => {
                if (mode === 'daily' && guesses.length > 0 && animatingRow === -1) {
                    localStorage.setItem('abyssdleDaily_v2', JSON.stringify({
                        dayIndex: getDailyTargetIndex(),
                        guesses,
                        gameStatus,
                        hintsRevealed
                    }));
                }
            }, [guesses, gameStatus, hintsRevealed, mode, animatingRow]);

            const showMessage = (msg, time = 2000) => {
                setToast(msg);
                setTimeout(() => setToast(''), time);
            };

            const triggerShake = () => {
                setShakeRow(guesses.length);
                setTimeout(() => setShakeRow(-1), 500);
            };

            const handleChar = useCallback((char) => {
                if (gameStatus !== 'playing' || animatingRow !== -1) return;
                if (currentGuess.length < targetLength) setCurrentGuess(prev => prev + char);
            }, [currentGuess, gameStatus, animatingRow, targetLength]);

            const handleDelete = useCallback(() => {
                if (gameStatus !== 'playing' || animatingRow !== -1) return;
                setCurrentGuess(prev => prev.slice(0, -1));
            }, [gameStatus, animatingRow]);

            const handleEnter = useCallback(() => {
                if (gameStatus !== 'playing' || animatingRow !== -1) return;
                
                // 1. Validate Length
                if (currentGuess.length !== targetLength) {
                    showMessage("Not enough letters");
                    triggerShake();
                    return;
                }

                // 2. Validate Word against Dictionary
                if (!dictionary.has(currentGuess)) {
                    showMessage("Not in PokeAPI database");
                    triggerShake();
                    return;
                }

                // If valid, submit the guess
                const newGuesses = [...guesses, currentGuess];
                setGuesses(newGuesses);
                setCurrentGuess('');
                setAnimatingRow(newGuesses.length - 1);

                // Wait for animation to finish
                const animDuration = (targetLength * 150) + 600;
                setTimeout(() => {
                    setRevealedRows(newGuesses.length);
                    setAnimatingRow(-1);

                    const isWin = currentGuess === target.name;
                    if (isWin) {
                        setGameStatus('won');
                        showMessage("Super Effective!", 3000);
                        updateStats(true, newGuesses.length);
                        setTimeout(() => setShowStats(true), 2000);
                    } else if (newGuesses.length === MAX_GUESSES) {
                        setGameStatus('lost');
                        showMessage(`It was ${target.name}`, null); 
                        updateStats(false);
                        setTimeout(() => setShowStats(true), 2000);
                    }
                }, animDuration);
            }, [currentGuess, targetLength, guesses, gameStatus, animatingRow, target.name, dictionary]);

            // Global Keyboard Listener
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Enter') handleEnter();
                    else if (e.key === 'Backspace') handleDelete();
                    else if (/^[A-Za-z\-]$/.test(e.key)) handleChar(e.key.toUpperCase());
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleEnter, handleDelete, handleChar]);

            // Calculate keyboard statuses
            const keyboardStatuses = useMemo(() => {
                const statuses = {};
                guesses.slice(0, revealedRows).forEach(g => {
                    const rowStatus = evaluateGuess(g, target.name);
                    g.split('').forEach((char, i) => {
                        const current = statuses[char];
                        const s = rowStatus[i];
                        if (s === 'correct') statuses[char] = 'correct';
                        else if (s === 'present' && current !== 'correct') statuses[char] = 'present';
                        else if (s === 'absent' && current !== 'correct' && current !== 'present') statuses[char] = 'absent';
                    });
                });
                return statuses;
            }, [guesses, revealedRows, target.name]);

            const updateStats = (won, numGuesses) => {
                if (mode !== 'daily') return;
                const stats = JSON.parse(localStorage.getItem('abyssdleStats')) || { played: 0, wins: 0, currentStreak: 0, maxStreak: 0, dist: Array(6).fill(0) };
                stats.played++;
                if (won) {
                    stats.wins++;
                    stats.currentStreak++;
                    stats.maxStreak = Math.max(stats.maxStreak, stats.currentStreak);
                    stats.dist[numGuesses - 1]++;
                } else {
                    stats.currentStreak = 0;
                }
                localStorage.setItem('abyssdleStats', JSON.stringify(stats));
            };

            const shareResult = () => {
                const displayDay = getDailyTargetIndex() + 1;
                const title = mode === 'daily' ? `Abyssdle Daily ${displayDay}` : 'Abyssdle Unlimited';
                const attempt = gameStatus === 'won' ? guesses.length : 'X';
                
                let grid = guesses.map(g => {
                    const s = evaluateGuess(g, target.name);
                    return s.map(status => {
                        if (status === 'correct') return '🟩';
                        if (status === 'present') return '🟨';
                        return '⬛';
                    }).join('');
                }).join('\n');

                const text = `${title} ${attempt}/${MAX_GUESSES}\n\n${grid}`;
                navigator.clipboard.writeText(text).then(() => showMessage("Copied to clipboard!"));
            };

            const statsData = JSON.parse(localStorage.getItem('abyssdleStats')) || { played: 0, wins: 0, currentStreak: 0, maxStreak: 0, dist: Array(6).fill(0) };

            return (
                <div className="flex flex-col min-h-screen pt-4 pb-8 w-full max-w-4xl mx-auto">
                    <Toast message={toast} />

                    {/* Header */}
                    <header className="flex flex-col items-center justify-center mb-6 px-4">
                        <div className="flex items-center gap-3 bg-cyan-800 px-6 py-3 rounded-full shadow-lg border-4 border-slate-900 ring-4 ring-cyan-800/30">
                            <RelicCrown className="w-10 h-10 text-amber-400 drop-shadow-md" />
                            <h1 className="text-3xl font-black tracking-wider text-white">Abyssdle</h1>
                        </div>
                        <div className="flex flex-wrap justify-center items-center gap-3 mt-4 text-sm font-semibold">
                            <button onClick={() => onModeSwitch('daily')} className={`px-4 py-1.5 rounded-full transition ${mode === 'daily' ? 'bg-slate-100 text-slate-900 shadow' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>Daily</button>
                            <button onClick={() => onModeSwitch('unlimited')} className={`px-4 py-1.5 rounded-full transition ${mode === 'unlimited' ? 'bg-slate-100 text-slate-900 shadow' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>Unlimited</button>
                            <div className="w-px h-6 bg-slate-700 mx-1"></div>
                            <button onClick={() => setShowHintModal(true)} className="px-3 py-1.5 rounded-full bg-slate-800 text-amber-400 hover:text-amber-300 hover:bg-slate-700 transition flex items-center gap-1 border border-slate-700">
                                💡 Hints
                            </button>
                            <button onClick={() => setShowInfoModal(true)} className="px-3 py-1.5 rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition flex items-center gap-1 border border-slate-700">
                                ℹ️ Help
                            </button>
                            <button onClick={() => setShowStats(true)} className="p-1.5 text-slate-400 hover:text-white bg-slate-800 rounded-full border border-slate-700 hover:bg-slate-700 transition">📊</button>
                        </div>
                        
                        <div className="mt-5 flex flex-col items-center text-center px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg shadow min-w-[200px]">
                            <div>
                                <span className="text-slate-400 mr-2">Target Category:</span>
                                <span className="font-bold text-cyan-400">{CAT_ICONS[target.category]} {target.category}</span>
                            </div>
                            <span className="text-xs font-semibold text-amber-400/80 mt-1 block">
                                * Remember: Spaces are typed as hyphens (-)
                            </span>
                        </div>
                    </header>

                    {/* Game Grid */}
                    <main className="flex-1 flex flex-col items-center justify-start w-full px-4 pt-2">
                        <div className="w-full flex flex-col gap-1 sm:gap-2">
                            {Array.from({ length: MAX_GUESSES }).map((_, i) => {
                                const isCurrent = i === guesses.length;
                                const isEvaluated = i < revealedRows;
                                const isAnimating = i === animatingRow;
                                const isShaking = i === shakeRow;
                                const guessLetters = isCurrent ? currentGuess : (guesses[i] || '');
                                const statuses = (isEvaluated || isAnimating) ? evaluateGuess(guesses[i], target.name) : null;

                                return (
                                    <Row 
                                        key={i} 
                                        targetLength={targetLength} 
                                        guessLetters={guessLetters}
                                        isEvaluated={isEvaluated || isAnimating}
                                        isAnimating={isAnimating}
                                        isShaking={isShaking}
                                        statuses={statuses}
                                    />
                                );
                            })}
                        </div>
                    </main>

                    <Keyboard onChar={handleChar} onDelete={handleDelete} onEnter={handleEnter} statuses={keyboardStatuses} />

                    {/* Hint Modal */}
                    <Modal isOpen={showHintModal} onClose={() => setShowHintModal(false)} title="💡 Game Hints">
                        <div className="flex flex-col gap-4">
                            <div className="p-4 bg-slate-700 rounded-lg border border-slate-600 shadow-inner min-h-[5rem] flex flex-col justify-center">
                                {hintsRevealed >= 1 ? (
                                    <p className="text-slate-200 text-lg"><span className="text-amber-400 font-bold mr-2">Hint 1:</span>{target.hints[0]}</p>
                                ) : (
                                    <button 
                                        onClick={() => setHintsRevealed(1)} 
                                        className="w-full py-3 bg-slate-600 hover:bg-slate-500 text-white rounded font-bold transition shadow"
                                    >
                                        Reveal Hint 1
                                    </button>
                                )}
                            </div>
                            <div className="p-4 bg-slate-700 rounded-lg border border-slate-600 shadow-inner min-h-[5rem] flex flex-col justify-center">
                                {hintsRevealed >= 2 ? (
                                    <p className="text-slate-200 text-lg"><span className="text-amber-400 font-bold mr-2">Hint 2:</span>{target.hints[1]}</p>
                                ) : (
                                    <button 
                                        onClick={() => setHintsRevealed(2)} 
                                        disabled={hintsRevealed < 1} 
                                        className="w-full py-3 bg-slate-600 hover:bg-slate-500 text-white rounded font-bold transition shadow disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        Reveal Hint 2
                                    </button>
                                )}
                            </div>
                        </div>
                    </Modal>

                    {/* Info/Help Modal */}
                    <Modal isOpen={showInfoModal} onClose={() => setShowInfoModal(false)} title="ℹ️ How to Play">
                        <div className="flex flex-col gap-3 text-slate-300 text-sm sm:text-base">
                            <p>Guess the hidden <strong>Pokémon, Move, Item, or Ability</strong> in 6 tries.</p>
                            
                            <div className="p-3 bg-slate-900 rounded border border-amber-500/50 mt-2">
                                <h3 className="font-bold text-amber-400 mb-2">⚠️ IMPORTANT RULES:</h3>
                                <ul className="list-disc pl-5 space-y-2">
                                    <li><strong>Spaces are Hyphens:</strong> The PokeAPI dictionary uses hyphens for all compound words. To guess <span className="text-white font-bold">Master Ball</span>, you MUST type <span className="text-white font-bold">MASTER-BALL</span>.</li>
                                    <li><strong>Base Species Only:</strong> Use base names for Pokémon, not specific forms (e.g. use <span className="text-white font-bold">ABOMASNOW</span>, not <span className="text-white font-bold">ABOMASNOW-MEGA</span>).</li>
                                    <li><strong>No Numbers:</strong> Names containing numbers (like Porygon2 or TM01) are excluded from the game entirely.</li>
                                </ul>
                            </div>
                        </div>
                    </Modal>

                    {/* Stats & Game Over Modal */}
                    <Modal isOpen={showStats} onClose={() => setShowStats(false)} title={gameStatus === 'playing' ? "Statistics" : (gameStatus === 'won' ? "You Won!" : "Game Over")}>
                        {gameStatus !== 'playing' && (
                            <div className="mb-6 text-center">
                                <p className="text-slate-400 mb-1">The target was</p>
                                <p className="text-2xl font-black text-cyan-400 tracking-widest">{target.name}</p>
                            </div>
                        )}
                        
                        <div className="grid grid-cols-4 gap-2 mb-6 text-center">
                            <div className="bg-slate-700 p-2 rounded"><div className="text-2xl font-bold">{statsData.played}</div><div className="text-xs text-slate-400">Played</div></div>
                            <div className="bg-slate-700 p-2 rounded"><div className="text-2xl font-bold">{statsData.played > 0 ? Math.round((statsData.wins/statsData.played)*100) : 0}%</div><div className="text-xs text-slate-400">Win %</div></div>
                            <div className="bg-slate-700 p-2 rounded"><div className="text-2xl font-bold">{statsData.currentStreak}</div><div className="text-xs text-slate-400">Streak</div></div>
                            <div className="bg-slate-700 p-2 rounded"><div className="text-2xl font-bold">{statsData.maxStreak}</div><div className="text-xs text-slate-400">Max</div></div>
                        </div>

                        {gameStatus !== 'playing' && (
                            <div className="flex flex-col gap-3">
                                <button onClick={shareResult} className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-white font-bold rounded-lg transition shadow">
                                    Share Result
                                </button>
                                {mode === 'unlimited' && (
                                    <button onClick={() => onModeSwitch('unlimited_force')} className="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg transition shadow">
                                        Play Again
                                    </button>
                                )}
                            </div>
                        )}
                    </Modal>
                </div>
            );
        };

        // App Wrapper - Manages Loading & DB state
        const App = () => {
            const [db, setDb] = useState(null);
            const [dictionary, setDictionary] = useState(null);
            const [target, setTarget] = useState(null);
            const [mode, setMode] = useState('daily'); 
            const [key, setKey] = useState(0); 
            const [loadingMsg, setLoadingMsg] = useState('Connecting to PokeAPI...');

            // 1. Fetch DB on mount
            useEffect(() => {
                const initDB = async () => {
                    const loadedDb = await loadPokeAPI();
                    setDb(loadedDb);
                    setDictionary(new Set(loadedDb.map(i => i.name)));
                };
                initDB();
            }, []);

            // 2. Setup Target when DB or Mode changes
            useEffect(() => {
                if (!db) return;
                
                const setupTarget = async () => {
                    setTarget(null); // Triggers loading UI
                    setLoadingMsg('Extracting target data from PokeAPI...');
                    
                    let selectedMeta;
                    if (mode === 'daily') {
                        selectedMeta = db[getDailyTargetIndex() % db.length];
                    } else {
                        selectedMeta = db[Math.floor(Math.random() * db.length)];
                    }
                    
                    // Fetch dynamic hints from PokeAPI
                    const hints = await fetchHints(selectedMeta);
                    setTarget({ ...selectedMeta, hints });
                };
                setupTarget();
            }, [db, mode, key]);

            const handleModeSwitch = (newMode) => {
                if (newMode === 'unlimited_force') {
                    setMode('unlimited');
                    setKey(k => k + 1);
                } else if (newMode !== mode) {
                    setMode(newMode);
                    setKey(k => k + 1);
                }
            };

            // Loading State UI
            if (!target) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen text-center px-4">
                        <RelicCrown className="w-16 h-16 text-amber-400 mb-6 spin-slow opacity-80" />
                        <h2 className="text-2xl font-bold text-white mb-2 tracking-widest uppercase">Abyssdle</h2>
                        <p className="text-cyan-400 animate-pulse">{loadingMsg}</p>
                    </div>
                );
            }

            return <Game key={`${mode}-${key}`} mode={mode} target={target} dictionary={dictionary} onModeSwitch={handleModeSwitch} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
